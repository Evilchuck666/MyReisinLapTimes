name: Build Windows app

# Disabled by default. Pushes and pull requests only build when the repository
# variable MYREISIN_CI is set to "true" (Settings → Secrets and variables →
# Actions → Variables). Only change detection and the final status run
# when no application work is needed. "Run workflow" always works: leave the version empty to just build,
# or give one (e.g. 1.0.0) to also publish a GitHub release with the .exe.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.0.0). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Keep the workflow visible to required checks; only relevant jobs run.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.filter.outputs.checks }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: filter
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_FILTERS: |
            {
              "checks": {
                "include": [
                  "**.cs",
                  "**.resx",
                  "**.csproj",
                  "**.sln",
                  "**.ico",
                  "assets/**",
                  "Properties/**",
                  "**.props",
                  "**.targets",
                  "NuGet.Config",
                  "nuget.config",
                  "global.json",
                  "packages.lock.json",
                  "tests/**",
                  ".github/workflows/release.yaml"
                ],
                "exclude": [
                  "tests/**.md"
                ]
              },
              "build": {
                "include": [
                  "**.cs",
                  "**.resx",
                  "**.csproj",
                  "**.sln",
                  "**.ico",
                  "assets/**",
                  "Properties/**",
                  "**.props",
                  "**.targets",
                  "NuGet.Config",
                  "nuget.config",
                  "global.json",
                  "packages.lock.json",
                  ".github/workflows/release.yaml"
                ],
                "exclude": []
              }
            }
        run: |
          import fnmatch
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          filters = json.loads(os.environ['CHANGE_FILTERS'])
          event = json.loads(open(os.environ['GITHUB_EVENT_PATH']).read())
          event_name = os.environ['EVENT_NAME']
          force = event_name in ('workflow_dispatch', 'schedule')
          paths = []
          if not force:
              if event_name == 'pull_request':
                  base = event['pull_request']['base']['sha']
                  head = event['pull_request']['head']['sha']
              else:
                  base, head = event['before'], event['after']
              if not all(re.fullmatch(r'[0-9a-fA-F]{40,64}', sha) for sha in (base, head)):
                  raise SystemExit('Invalid Git object ID in event')
              available = base.strip('0') and subprocess.run(
                  ['git', 'cat-file', '-e', base + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not available:
                  # Initial/force pushes can omit the old commit. Validate everything safely.
                  force = True
              else:
                  if event_name == 'pull_request':
                      base = git('merge-base', base, head).decode().strip()
                  paths = git('diff', '--no-renames', '--name-only', '-z', base, head).decode().split('\0')
                  paths = [path for path in paths if path]

          def matches(path, patterns):
              # fnmatch's * includes /; a leading **/ also matches root-level files.
              return any(fnmatch.fnmatchcase(path, pattern) or (
                  pattern.startswith('**/') and fnmatch.fnmatchcase(path, pattern[3:])
              ) for pattern in patterns)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, patterns in filters.items():
                  selected = force or any(
                      matches(path, patterns['include']) and not matches(path, patterns.get('exclude', []))
                      for path in paths
                  )
                  value = str(selected).lower()
                  print(f'{name}={value}', file=output)
                  print(f'{name}: {value}')

  windows:
    needs: [changes]
    if: (needs.changes.outputs.checks == 'true' || needs.changes.outputs.build == 'true') && (github.event_name == 'workflow_dispatch' || vars.MYREISIN_CI == 'true')
    name: Build (windows-x64)
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      VERSION: ${{ inputs.version }}
      EXE: MyReisinLapTimes-windows-x64.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MyReisinLapTimes.csproj -r win-x64

      - name: Check export font
        run: |
          if [[ ! -f assets/Racing.otf ]]; then
            echo "::warning::assets/Racing.otf is not in the repository. Image export will not work until the font is added."
          fi

      # One self-contained .exe. IncludeAllContentForSelfExtract also bundles
      # assets/, which is extracted on first run and found via
      # AppContext.BaseDirectory.
      - name: Publish single-file executable
        run: |
          set -euo pipefail
          version_args=()
          if [[ -n "$VERSION" ]]; then
            version_args=(-p:Version="$VERSION")
          fi
          dotnet publish MyReisinLapTimes.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            "${version_args[@]}" -o dist/publish
          cp dist/publish/MyReisinLapTimes.exe "dist/$EXE"

      - name: Verify executable
        run: |
          set -euo pipefail
          extra=$(find dist/publish -type f ! -name MyReisinLapTimes.exe)
          if [[ -n "$extra" ]]; then
            echo "::error::Single-file publish left extra files behind:"
            echo "$extra"
            exit 1
          fi
          ls -l "dist/$EXE"

      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.build == 'true'
        with:
          name: MyReisinLapTimes-windows-x64
          path: dist/${{ env.EXE }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: myreisinlaptimes-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}
      PACKAGES: MyReisinLapTimes-windows-x64.exe
    steps:
      - name: Validate version and check tag
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version like 1.0.0, without the v."
            exit 1
          fi

          # An API failure must stop the release, so no "|| true" here.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[].ref' > tags.txt
          if grep -Fxq "refs/tags/v$VERSION" tags.txt; then
            echo "::error::Tag v$VERSION already exists. Use another version."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: MyReisinLapTimes-*
          path: release-assets
          merge-multiple: true

      - name: Check packages and generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          for file in $PACKAGES; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Package $file is missing or empty."
              exit 1
            fi
          done
          sha256sum $PACKAGES > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag and publish release
        working-directory: release-assets
        run: |
          set -euo pipefail
          gh release create "v$VERSION" $PACKAGES SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --target "$RELEASE_SHA" \
            --title "MyReisinLapTimes v$VERSION" \
            --generate-notes \
            --latest

  result:
    name: CI result
    if: always()
    needs: [changes, windows, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] in ('failure', 'cancelled')]
          if results['changes']['result'] != 'success':
              failed.append('changes')
          if failed:
              raise SystemExit('Unsuccessful jobs: ' + ', '.join(sorted(set(failed))))
          print('All relevant jobs passed; unrelated jobs were skipped.')
